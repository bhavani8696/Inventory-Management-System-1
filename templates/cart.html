<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Management System 1</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>
<nav><div class="logo">Inventory Marketplace</div>
<div class="nav"><a href="/">Dashboard</a><a href="/products">Products</a><a href="/wishlist">Wishlist <span class="badge" data-wishlist-count>0</span></a><a href="/cart">Cart <span class="badge" data-cart-count>0</span></a>{% if admin_user %}<a href="/add-product">Add Product</a>{% endif %}<a href="/logout">Logout</a></div></nav>
