<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Management System 1</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>
<nav><div class="logo">Inventory Marketplace</div>
<div class="nav"><a href="/">Dashboard</a><a href="/products">Products</a><a href="/wishlist">Wishlist <span class="badge" data-wishlist-count>0</span></a><a href="/cart">Cart <span class="badge" data-cart-count>0</span></a>{% if admin_user %}<a href="/add-product">Add Product</a>{% endif %}<a href="/logout">Logout</a></div></nav>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{category}}">{{msg}}</div>{% endfor %}{% endwith %}
<div class="formbox"><h2>{{"Edit Product" if product else "Add Product"}}</h2><form method="post" enctype="multipart/form-data"><label>Product Name</label><input name="product_name" required value="{{product.product_name if product else ''}}"><label>Category</label><input name="category" required value="{{product.category if product else ''}}"><label>Price</label><input name="price" type="number" step="0.01" required value="{{product.price if product else ''}}"><label>Quantity</label><input name="quantity" type="number" min="0" required value="{{product.quantity if product else ''}}"><label>Image</label><input name="image" type="file" accept="image/*"><button class="btn">Save Product</button></form></div>
</main><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
